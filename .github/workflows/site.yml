name: site

# The public website, published to GitHub Pages at https://maroonedsoftware.com.
#
# Every push to `main` deploys: the repository is the site and nothing else. Pull requests build it
# without deploying, so a broken link fails there first.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

# One deployment at a time, and a queued one is never cancelled: Pages publishes whichever finishes
# last, so cancelling the older run is what could leave the older site up.
concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Test
              run: pnpm test

            # Type-checks, then builds. `onBrokenLinks: 'throw'` fails it on a dead link.
            - name: Build
              run: pnpm build

            # Fails here, with a message saying so, if Pages is not set to deploy from Actions.
            - if: github.event_name != 'pull_request'
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        # The only job with any write access, and only to Pages.
        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
